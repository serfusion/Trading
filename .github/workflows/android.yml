name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest sudah membawa Android SDK (ANDROID_HOME); AGP mengunduh
      # platform/build-tools yang kurang secara otomatis.
      - name: Info Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint + unit test + build APK (debug, bisa langsung dipasang)
        working-directory: android
        run: gradle lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Laporan lint & unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-build
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Signal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Aplikasi dijalankan sungguhan di emulator: minSdk (Android 8) dan targetSdk (Android 14).
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Uji UI di emulator API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Laporan uji emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-emulator-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  # APK hanya dipublikasikan bila build, lint, unit test, DAN uji emulator semuanya lolos.
  release:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XAU-Signal-apk

      - name: Publikasikan ke GitHub Release "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: XAU Signal (APK terbaru)
          prerelease: true
          body: "APK debug terbaru dari branch ${{ github.ref_name }} (${{ github.sha }}). Lolos lint, unit test, dan uji UI di emulator Android 8 & 14."
          files: app-debug.apk
