name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug, bisa langsung dipasang)
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Signal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publikasikan ke GitHub Release "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: XAU Signal (APK terbaru)
          prerelease: true
          body: "APK debug terbaru dari branch ${{ github.ref_name }} (${{ github.sha }})."
          files: android/app/build/outputs/apk/debug/app-debug.apk
