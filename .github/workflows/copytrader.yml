name: Copy trader teruji (mingguan)

# 👥 Perbarui cloud/api/copytrader.json tiap Senin 07:41 WIB: unduh ulang daftar eToro, Binance, OKX, Bitget, MQL5, vault &
# trader Hyperliquid (±30 menit: 1.400 portofolio, research/hl_trader.py), cek posisi terlihat (👁) & peringkat 🥇/🥈/🥉,
# saring dengan aturan research/copy_pilih.py, commit bila berubah (Vercel ikut redeploy). Satu sumber gagal → daftar
# minggu lalu dipakai untuk sumber itu (ditandai "invalid"); semua gagal → file tidak diubah.
on:
  schedule:
    - cron: "41 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copytrader
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Selalu perbarui main (Vercel production), walau default branch repo berbeda.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang pandas & numpy
        run: pip install "pandas>=2.0" "numpy>=1.24"

      - name: Pilih copy trader
        run: python -m research.copy_pilih --segar

      - name: Commit bila berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp cloud/api/copytrader.json android/app/src/main/assets/copytrader.json   # cadangan offline di APK
          git add cloud/api/copytrader.json android/app/src/main/assets/copytrader.json
          if git diff --cached --quiet; then
            echo "tidak ada perubahan"
          else
            git commit -m "Copy trader teruji: pembaruan mingguan $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            # Vercel production = branch claude/bold-davinci-ykgq8j (ikut diperbarui supaya aplikasi langsung dapat data baru)
            git fetch -q origin claude/bold-davinci-ykgq8j
            git push origin HEAD:claude/bold-davinci-ykgq8j || {
              git checkout -q -B prod origin/claude/bold-davinci-ykgq8j && git merge -q --no-edit main
              git push origin prod:claude/bold-davinci-ykgq8j; }
          fi
