# Konfigurasi bot token — salin ke token_bot/config.yaml lalu ubah. Angka bawaan dari riset docs/TOKEN_BARU.md.
# Alamat kontrak Uniswap: halaman resmi developers.uniswap.org (v3/v4 deployments), dicek 8 Okt 2026.
# Token: alamat RESMI saja (banyak token TIRUAN beralamat mirip: awal & akhir sama, mis. USDG/NVDA/WETH palsu).

ntfy_topic: ""          # isi nama topik ntfy.sh bila ingin notifikasi HP (opsional)

# Bot kontrol Telegram (python -m token_bot bot, docs/ARB_BOT.md). Rahasia di token_bot/.env (TELEGRAM_TOKEN,
# TELEGRAM_CHAT_ID) — JANGAN di-commit. State per mode di token_bot/data/<mode>/.
# Bot TIDAK mengirim transaksi nyata (tanpa private key): eksekusi kamu lakukan sendiri di dompetmu.
mode: pantau            # pantau (hanya kabar, bawaan) | kertas (simulasi uang palsu, 🅰 BUY ON)
modal_kertas_usd: 500   # saldo awal mode kertas
maks_trade_per_hari: 50 # batas simulasi kertas
interval: 5             # detik antar pindai
jeda_kabar: 60          # detik minimal antar kabar peluang untuk pasangan yang sama (anti-spam)
telegram:
  aktif: true
  interval_poll: 25

bawaan:                 # dipakai bila pasangan tidak menulis sendiri
  ukuran_usd: 200       # ukuran awal; diperkecil otomatis sampai slippage <= max_slippage
  min_usd: 10
  beli_bawah: 0.01      # sinyal hanya bila untung BERSIH >= 1%: diskon beli (fee+slippage+gas) dikurangi biaya keluar
                        # (jual balik di DEX, atau tebus jembatan untuk tebus_manual)
  jual_atas: 0.01
  max_slippage: 0.005   # 0,5% dari harga spot pool (termasuk fee pool)
  tp: 0.02
  sl: 0.04
  biaya_gas_usd: 0.02
  luar_jam: false       # saham: jangan transaksi saat bursa AS tutup (acuan basi)
  tebus_manual: false   # true untuk TOKEN JEMBATAN (mis. WETH/CRCL/NVDA•Arc): keluar lewat tebus 1:1 manual, bukan jual
                        # DEX (jual di pool tipis = diskon yang sama). Bot tidak memberi sinyal JUAL untuk posisinya.
  biaya_tebus: 0.01     # biaya jembatan Arc<->Robinhood 1% (docs/eksternal/hasil_arb_cari.txt A3)

