<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GILD AI | Telegram Active</title>
    <style>
        body { background: #0b0e11; color: white; font-family: sans-serif; padding: 20px; }
        .gold { color: #d4af37; }
        .green { color: #2ecc71; }
        .red { color: #e74c3c; }
        .card { background: #1c2229; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }
        main { display: flex; gap: 20px; }
        #tv_chart { flex: 2; height: 500px; }
        .panel { flex: 1; }
    </style>
</head>
<body>
    <h1>GILD <span class="gold">AI</span> TERMINAL v2.3</h1>
    <main>
        <div id="tv_chart"></div>
        <div class="panel">
            <div class="card">
                <h3>XAUUSD Price: <span id="p" class="gold">$0.00</span></h3>
                <p>Telegram Alerts: <span class="green">Active ✅</span></p>
            </div>
            <div class="card">
                <h2 id="sig">ANALYZING...</h2>
                <p id="acc">Confidence: 0%</p>
            </div>
        </div>
    </main>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        new TradingView.widget({"width": "100%", "height": 500, "symbol": "OANDA:XAUUSD", "theme": "dark", "container_id": "tv_chart"});
        async function update() {
            try {
                const r = await fetch('http://localhost:5000/api/data');
                const d = await r.json();
                document.getElementById('p').innerText = '$' + d.price;
                document.getElementById('sig').innerText = d.signal;
                document.getElementById('acc').innerText = 'AI Confidence: ' + d.accuracy;
                document.getElementById('sig').className = d.signal.includes('BUY') ? 'green' : d.signal.includes('SELL') ? 'red' : '';
            } catch (e) {}
        }
        setInterval(update, 2000);
    </script>
</body>
</html>
